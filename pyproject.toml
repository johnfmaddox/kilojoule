[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kilojoule"
dynamic = ["version"]
description = "A convenience package for engineering calculations with a focus on fluids mechanics, thermodynamics, and heat transfer"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Jack Maddox", email = "jackmaddox@gmail.com" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "scipy",
    "sympy",
    "pandas",
    "matplotlib",
    "pint",
    "pint-pandas",
    "uncertainties",
    "coolprop",
    "pyromat",
    "regex",
    "rich",
    "schemdraw",   # required to use the drawing library
    "sigfig",      # required to check solutions
    "emoji",       # optional for "prettier" solution checking
    "icecream",
    "seaborn",
    "ipython",
    "ipynbname",   # used by kilojoule.export to find the notebook path outside CoCalc
]

[project.urls]
Homepage = "https://github.com/johnfmaddox/kilojoule"
Notebooks = "https://github.com/johnfmaddox/kilojoule-notebooks"
Changelog = "https://github.com/johnfmaddox/kilojoule/blob/main/CHANGELOG.rst"

[project.optional-dependencies]
jupyter = ["jupyter-resource-usage"]
test = ["pytest"]
docs = ["sphinx", "sphinx-rtd-theme"]

[tool.setuptools.packages.find]
include = ["kilojoule*"]

[tool.setuptools_scm]
write_to = "kilojoule/_version.py"
fallback_version = "0.0.0"
# Default local_scheme appends "+g<hash>.d<date>" for untagged commits
# (e.g. 0.3.5.dev14+ge1af1a8f1.d20260810). PyPI/TestPyPI both reject
# uploads with a PEP 440 local version segment, so builds from anything
# but a clean tag would fail to publish. Dropping it means dev builds are
# just "0.3.5.dev14" -- publishable, at the cost of the commit hash no
# longer being embedded in the version string.
local_scheme = "no-local-version"

# TestPyPI as an explicit (opt-in only) index -- `explicit = true` keeps it
# out of normal dependency resolution; publishing to it is `uv publish
# --index testpypi`.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
