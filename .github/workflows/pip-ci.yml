name: Publish Python Package

# Trusted Publishing (OIDC) -- no stored PyPI/TestPyPI tokens. Each publish
# job's `environment:` must match a trusted publisher registered on the
# corresponding index (test.pypi.org / pypi.org -> project -> Settings ->
# Publishing), pointing at this repo, this workflow filename, and that
# same environment name.

on:
  release:
    types: [published]
  workflow_dispatch:
    # Manually publish the currently-selected branch/tag to TestPyPI --
    # e.g. to try out `devel` before it's tagged for a real release.
  push:
    branches: [devel]
    # TEMPORARY: workflow_dispatch only shows up for manual triggering
    # once GitHub has indexed this workflow file, which (for a
    # non-default branch) requires it to have run at least once via some
    # other trigger. This push trigger only ever runs the `test` job
    # (publish-testpypi/publish-pypi are gated by `if:` on event_name),
    # so it's a safe one-time bootstrap. Remove once `gh workflow run
    # pip-ci.yml --ref devel` (or the Actions UI) works.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install package with test dependencies
        run: uv sync --extra test
      - name: Run tests
        run: uv run pytest tests/ -v

  publish-testpypi:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # setuptools-scm needs the full history (and tags) to compute
          # the package version; a shallow clone breaks it.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Build package
        run: uv build
      - name: Publish package to TestPyPI
        run: uv publish --index testpypi --trusted-publishing always

  publish-pypi:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Build package
        run: uv build
      - name: Publish package to PyPI
        run: uv publish --trusted-publishing always
